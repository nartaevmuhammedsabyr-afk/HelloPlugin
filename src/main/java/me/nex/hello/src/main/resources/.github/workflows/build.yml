name: Build Minecraft Plugin

on:
push:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      java-version: '21'
      distribution: temurin
      cache: maven

  - name: Build plugin
    run: mvn clean package

  - name: Upload JAR
    uses: actions/upload-artifact@v4
    with:
      name: HelloPlugin
      path: target/*.jar
